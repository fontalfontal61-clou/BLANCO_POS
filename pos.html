rules_version = '2';
service cloud.firestore { match /databases/{d}/documents {
  match /staffIdx/{id} {
    allow read: if true;
    allow create, update: if request.auth != null && get(/databases/$(d)/documents/shops/$(request.resource.data.sid)).data.owner == request.auth.uid;
  }
  match /admins/{uid} { allow read: if request.auth != null && request.auth.uid == uid; }
  match /users/{uid} {
    allow read: if request.auth != null && request.auth.uid == uid;
    allow create: if request.auth != null && (request.auth.uid == uid
      || get(/databases/$(d)/documents/shops/$(request.resource.data.sid)).data.owner == request.auth.uid);
    allow delete: if request.auth != null
      && get(/databases/$(d)/documents/shops/$(resource.data.sid)).data.owner == request.auth.uid;
  }
  match /shops/{sid} {
    function owner() { return request.auth != null && get(/databases/$(d)/documents/shops/$(sid)).data.owner == request.auth.uid; }
    function member() { return request.auth != null && exists(/databases/$(d)/documents/shops/$(sid)/members/$(request.auth.uid)); }
    function admin() { return request.auth != null && exists(/databases/$(d)/documents/admins/$(request.auth.uid)); }
    function active() { let s = get(/databases/$(d)/documents/shops/$(sid)).data;
      return s.get('paidUntil', 0) > request.time.toMillis() || s.get('trialEnd', 0) > request.time.toMillis(); }
    allow read: if member() || admin();
    allow create: if request.auth != null && request.resource.data.owner == request.auth.uid
      && request.resource.data.trialEnd <= request.time.toMillis() + 1382400000
      && !('paidUntil' in request.resource.data);
    allow update: if admin() || (owner() && !request.resource.data.diff(resource.data).affectedKeys().hasAny(['trialEnd','paidUntil','owner']));
    allow delete: if admin();
    match /members/{uid} {
      allow read: if request.auth != null && (request.auth.uid == uid || owner());
      allow create: if request.auth != null && (owner()
        || (request.auth.uid == uid && getAfter(/databases/$(d)/documents/shops/$(sid)).data.owner == uid));
      allow update, delete: if owner();
    }
    match /products/{id} {
      allow read: if member();
      allow create, delete: if owner() && active();
      allow update: if active() && (owner() || (member() && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['qty'])));
    }
    match /sales/{id} {
      allow read: if owner() || (member() && resource.data.seller == request.auth.uid);
      allow create: if member() && active() && request.resource.data.seller == request.auth.uid;
      allow update: if active() && (owner() || (member() && resource.data.seller == request.auth.uid && request.resource.data.seller == request.auth.uid));
      allow delete: if active() && (owner() || (member() && resource.data.seller == request.auth.uid));
    }
    match /moves/{id} { allow read: if owner(); allow create: if owner() && active(); }
    match /daily/{id} { allow read: if owner(); allow create, update: if owner() && active(); }
    match /logs/{id} { allow create: if member() && active(); allow read: if owner(); }
  } } }

let discV='',discT='amt',taxOn=true;
function cartItems(){return Object.keys(cart).map(id=>{const p=prods.find(x=>x.id===id);return p?{id,name:p.name,price:p.price,qty:cart[id]}:null}).filter(Boolean)}
function calcT(items,o){
  o=o||{discT,discV,taxOn};const sub=items.reduce((a,i)=>a+i.price*i.qty,0),sh=shop||{};
  const v=Math.max(0,parseFloat(o.discV)||0),disc=+(o.discT==='pct'?sub*Math.min(v,100)/100:Math.min(v,sub)).toFixed(2);

  return{sub,disc,discT:o.discT,discV:v,taxR,tax,taxName:sh.taxName||'',total:+(sub-disc+tax).toFixed(2)}}

/* ---------- suppression automatique des anciens reçus ---------- */
let dailies=[],purging=false,purged=false;
function archSum(from){return dailies.filter(d=>d.t>=from).reduce((a,d)=>({n:a.n+(+d.n||0),rev:a.rev+(+d.rev||0),tx:a.tx+(+d.tax||0),dc:a.dc+(+d.disc||0)}),{n:0,rev:0,tx:0,dc:0})}
async function runPurge(manual){
  if(purging||!isOwner()||!shop)return 0;if(!manual&&!shop.autoPurge)return 0;
  const days=Math.max(7,parseInt(shop.purgeDays)||15),cut=new Date().setHours(0,0,0,0)-days*864e5;let total=0;purging=true;
  try{
    for(let r=0;r<12;r++){
      const q=await sc('sales').where('t','<',cut).limit(240).get();if(!q.docs.length)break;
      const agg={},b=db.batch();
      q.docs.forEach(d=>{const s=d.data(),dk=new Date(s.t).setHours(0,0,0,0),a=agg[dk]||(agg[dk]={n:0,rev:0,tax:0,disc:0,pm:{}}),k=String(s.pay||'cash').replace(/[^A-Za-z0-9]/g,'');
        a.n++;a.rev+=+s.total||0;a.tax+=+s.tax||0;a.disc+=+s.disc||0;a.pm[k]=(a.pm[k]||0)+(+s.total||0);b.delete(sc('sales').doc(d.id))});
      Object.keys(agg).forEach(dk=>{const a=agg[dk],dd=new Date(+dk),o={t:+dk,n:fv.increment(a.n),rev:fv.increment(a.rev),tax:fv.increment(a.tax),disc:fv.increment(a.disc)};
        Object.keys(a.pm).forEach(k=>o['pm_'+k]=fv.increment(a.pm[k]));
        b.set(sc('daily').doc(dd.getFullYear()+'-'+String(dd.getMonth()+1).padStart(2,'0')+'-'+String(dd.getDate()).padStart(2,'0')),o,{merge:true})});
      await b.commit();total+=q.docs.length}
  }catch(e){if(manual)say(fsErr(e),1)}
  purging=false;if(manual){if(!err)say(t('purgedN').replace('{n}',total));draw()}return total}

function escRap(d){

  const B=[0x1b,0x40],txt=x=>{for(const c of enc(x))B.push(c.charCodeAt(0));B.push(10)},al=n=>B.push(0x1b,0x61,n),bd=n=>B.push(0x1b,0x45,n),sh=shop||{},hr=()=>txt('-'.repeat(w));
  al(1);escNameBytes(sh,w,enc).forEach(v=>B.push(v));txt(t('rapT')+' - '+d.label);txt(dt(Date.now()));al(0);hr();
  txt(line(t('sales'),String(d.cnt)));bd(1);txt(line(t('rev'),money(d.rev)));bd(0);if(d.tx>0)txt(line(t('tax'),money(d.tx)));if(d.dc>0)txt(line(t('disc'),'- '+money(d.dc)));

/* ---------- mode démo : mini base locale (même API que Firebase) ---------- */
function localBackend(){
  let S={},L=[],cb=null,cur=null;
  try{S=JSON.parse(localStorage.getItem('mp_demo')||'{}');cur=JSON.parse(localStorage.getItem('mp_demo_cur')||'null')}catch(e){}
  addEventListener('storage',e=>{if(e.key==='mp_demo'){try{S=JSON.parse(e.newValue||'{}')}catch(_){S={}}L.slice().forEach(f=>f())}});
  const save=()=>{try{localStorage.setItem('mp_demo',JSON.stringify(S))}catch(e){}},fire=()=>{save();setTimeout(()=>L.slice().forEach(f=>f()),0)};
  const put=(p,d,keep)=>{const o=keep?(S[p]||{}):{};for(const k in d){const v=d[k];o[k]=(v&&v.__inc!==undefined)?(o[k]||0)+v.__inc:v}S[p]=o};
  const cp=o=>JSON.parse(JSON.stringify(o)),snap=p=>({exists:!!S[p],data:()=>S[p]?cp(S[p]):undefined});
  const sub=(f,get)=>{const r=()=>f(get());L.push(r);r();return()=>{L=L.filter(x=>x!==r)}};
  const dref=p=>({path:p,get:async()=>snap(p),set:async d=>{put(p,d);fire()},update:async d=>{if(!S[p])throw new Error('Not found');put(p,d,1);fire()},delete:async()=>{delete S[p];fire()},onSnapshot:f=>sub(f,()=>snap(p))});
  const cref=(path,fl)=>{const rows=()=>{const re=new RegExp('^'+path+'/[^/]+$');return Object.keys(S).filter(k=>re.test(k)&&(!fl||(fl[2]==='<'?S[k][fl[0]]<fl[1]:fl[2]==='<='?S[k][fl[0]]<=fl[1]:fl[2]==='>'?S[k][fl[0]]>fl[1]:fl[2]==='>='?S[k][fl[0]]>=fl[1]:S[k][fl[0]]===fl[1]))).map(k=>({id:k.split('/').pop(),data:()=>cp(S[k])}))};
    return{doc:id=>dref(path+'/'+id),add:async d=>{const id='p'+Math.random().toString(36).slice(2,9);put(path+'/'+id,d);fire();return{id}},where:(f,o,v)=>cref(path,[f,v,o]),orderBy:()=>cref(path,fl),limit:()=>cref(path,fl),get:async()=>({docs:rows()}),onSnapshot:(a,b)=>sub(b||a,()=>({docs:rows()}))}};
  const setCur=u=>{cur=u;try{localStorage.setItem('mp_demo_cur',JSON.stringify(u))}catch(e){}if(cb)cb(u)};
  const mk=(e,p)=>{e=String(e).toLowerCase().trim();if(!/\S+@\S+\.\S+/.test(e))throw{code:'auth/invalid-email'};if(String(p).length<6)throw{code:'auth/weak-password'};if(S['_auth/'+e])throw{code:'auth/email-already-in-use'};
    const u={uid:'u'+Math.random().toString(36).slice(2,11),email:e};S['_auth/'+e]={uid:u.uid,pw:p};save();return u};
  const auth={onAuthStateChanged:f=>{cb=f;setTimeout(()=>f(cur),0)},
    createUserWithEmailAndPassword:async(e,p)=>{const u=mk(e,p);setCur(u);return{user:u}},createOnly:async(e,p)=>mk(e,p).uid,
    signInWithEmailAndPassword:async(e,p)=>{e=String(e).toLowerCase().trim();const a=S['_auth/'+e];if(!a||a.pw!==p)throw{code:'auth/invalid-credential'};const u={uid:a.uid,email:e};setCur(u);return{user:u}},
    signOut:async()=>setCur(null),sendPasswordResetEmail:async()=>{},changePw:async(em,cu,nw)=>{const a=S['_auth/'+em];if(!a||a.pw!==cu)throw{code:'auth/wrong-password'};if(String(nw).length<6)throw{code:'auth/weak-password'};a.pw=nw;save()}};
  const db={doc:dref,collection:p=>cref(p),batch:()=>{const ops=[],b={set:(r,d,m)=>(ops.push(()=>put(r.path,d,m&&m.merge)),b),update:(r,d)=>(ops.push(()=>put(r.path,d,1)),b),delete:r=>(ops.push(()=>{delete S[r.path]}),b),commit:async()=>{ops.forEach(f=>f());fire()}};return b}};
  return{db,auth,fv:{increment:n=>({__inc:n})}}}

/* ---------- diagnostic des erreurs Firebase ---------- */
function authErr(x){
  const c=(x&&x.code)||'',m={
   'auth/operation-not-allowed':['Email/Password pa aktive nan Firebase (Authentication › Sign-in method).','Email/Password n’est pas activé dans Firebase (Authentication › Sign-in method).'],
   'auth/unauthorized-domain':['Domèn sa a pa nan Authorized domains (Authentication › Settings).','Ce domaine n’est pas dans Authorized domains (Authentication › Settings).'],
   'auth/invalid-api-key':['Kle API Firebase la pa bon. Verifye konfigirasyon an.','Clé API Firebase invalide. Vérifiez la configuration.'],
   'auth/api-key-not-valid':['Kle API Firebase la pa bon. Verifye konfigirasyon an.','Clé API Firebase invalide. Vérifiez la configuration.'],
   'auth/network-request-failed':['Pa gen koneksyon entènèt, oswa Firebase bloke.','Pas de connexion internet, ou Firebase est bloqué.'],
   'auth/email-already-in-use':['Imèl sa a gen yon kont deja. Konekte.','Cet e-mail a déjà un compte. Connectez-vous.'],
   'auth/weak-password':['Modpas la dwe gen omwen 6 karaktè.','Le mot de passe doit avoir au moins 6 caractères.'],
   'auth/invalid-email':['Imèl la pa valid.','E-mail invalide.'],
   'auth/too-many-requests':['Twòp esè. Tann yon ti moman epi eseye ankò.','Trop de tentatives. Patientez puis réessayez.']}[c];
  return (m?m[lang==='fr'?1:0]:t('bad'))+(c?' ('+c+')':'')}
function fsErr(e){
  const c=(e&&e.code)||'',m=String((e&&e.message)||'');
  if(c==='permission-denied')return t('rulesMsg')+' ('+c+')';
  if(c==='not-found'||/does not exist|NOT_FOUND/i.test(m))return t('noDb')+' ('+(c||'not-found')+')';
  if(c==='unavailable')return t('fsDown')+' ('+c+')';
  return t('err')+m}
